name: Frontend CI/CD

# ========================================
# 実行トリガー
# ========================================
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ========================================
  # CI：品質チェック
  # ========================================
  ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ソースコードの取得
      - name: Checkout source code
        uses: actions/checkout@v5

      # Node.js実行環境の構築
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      # 依存ライブラリのインストール
      - name: Install dependencies
        run: npm ci

      # ESLintによる静的解析
      - name: Run lint
        run: npm run lint

      # TypeScriptの型チェック
      - name: Run type check
        run: npm run typecheck

      # 本番用ビルドチェック
      - name: Run build
        run: npm run build

  # ========================================
  # CD：AWSへの自動デプロイ
  # ========================================
  deploy:
    name: Deploy Frontend to AWS

    # CIが成功した場合のみ実行
    needs: ci

    # mainブランチへのPush・手動実行のみ許可
    if: >-
      success() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')

    runs-on: ubuntu-latest
    timeout-minutes: 75

    # AWSへのOIDC認証権限
    permissions:
      contents: read
      id-token: write

    # 同時デプロイの防止
    concurrency:
      group: portfolio-frontend-production
      cancel-in-progress: false

    # ========================================
    # 環境変数
    # ========================================
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      SSM_DOCUMENT_NAME: Portfolio-Deploy-Frontend
      PARAMETER_NAME: /portfolio/deploy/frontend/pending-sha
      COMMIT_SHA: ${{ github.sha }}
      AWS_PAGER: ""

    steps:
      # ========================================
      # デプロイ対象コミットの確認
      # ========================================
      - name: Validate deployment commit
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # コミットSHAの形式チェック
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid commit SHA."
            exit 1
          fi

          # mainブランチの最新SHAを取得
          LATEST_SHA=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            --jq '.object.sha')

          echo "Target commit: $COMMIT_SHA"
          echo "Latest commit: $LATEST_SHA"

          # 古いワークフローによる上書きを防止
          if [[ "$COMMIT_SHA" != "$LATEST_SHA" ]]; then
            echo "A newer commit exists. Skipping deployment."
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "valid=true" >> "$GITHUB_OUTPUT"

      # ========================================
      # OIDCによるAWS認証
      # ========================================
      - name: Configure AWS credentials
        if: steps.validate.outputs.valid == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 5400

      # AWS認証情報の確認
      - name: Verify AWS identity
        if: steps.validate.outputs.valid == 'true'
        shell: bash
        run: aws sts get-caller-identity

      # ========================================
      # デプロイ対象SHAの保存
      # ========================================
      - name: Save deployment commit
        if: steps.validate.outputs.valid == 'true'
        shell: bash
        run: |
          set -euo pipefail

          # CI成功済みコミットをParameter Storeに保存
          aws ssm put-parameter \
            --name "$PARAMETER_NAME" \
            --value "$COMMIT_SHA" \
            --type String \
            --overwrite \
            --region "$AWS_REGION"

          echo "Deployment commit saved: $COMMIT_SHA"

      # ========================================
      # EC2の稼働状態・時間帯の確認
      # ========================================
      - name: Check deployment availability
        id: availability
        if: steps.validate.outputs.valid == 'true'
        shell: bash
        run: |
          set -euo pipefail

          # EC2の稼働状態を取得
          INSTANCE_STATE=$(aws ec2 describe-instances \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text)

          # 日本時間を取得
          CURRENT_HOUR=$(TZ=Asia/Tokyo date '+%H')

          echo "EC2 state: $INSTANCE_STATE"
          echo "Current JST hour: $CURRENT_HOUR"

          # EC2が稼働していない場合は保留
          if [[ "$INSTANCE_STATE" != "running" ]]; then
            echo "EC2 is not running. Deployment deferred."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # デプロイ可能時間は08:00〜17:59
          if (( 10#$CURRENT_HOUR < 8 || 10#$CURRENT_HOUR >= 18 )); then
            echo "Outside deployment hours. Deployment deferred."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"

      # ========================================
      # SSM経由で即時デプロイを実行
      # ========================================
      - name: Execute deployment
        id: deploy
        if: steps.availability.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --document-name "$SSM_DOCUMENT_NAME" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --parameters "CommitSha=$COMMIT_SHA" \
            --timeout-seconds 120 \
            --comment "GitHub Actions Frontend Deployment" \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      # ========================================
      # デプロイ処理の完了を待機
      # ========================================
      - name: Wait for deployment
        if: steps.deploy.outputs.command_id != ''
        shell: bash
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          set -euo pipefail

          for i in $(seq 1 400); do

            if ! STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text); then

              sleep 10
              continue
            fi

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment completed."
                exit 0
                ;;

              Pending|InProgress|Delayed|Cancelling)
                sleep 10
                ;;

              *)
                echo "Deployment failed: $STATUS"
                echo "Deployment commit remains in Parameter Store."
                exit 1
                ;;
            esac

          done

          echo "Deployment timed out."
          exit 1

      # ========================================
      # デプロイ結果の出力
      # ========================================
      - name: Show deployment result
        if: always() && steps.deploy.outputs.command_id != ''
        shell: bash
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json

      # ========================================
      # デプロイ保留時の結果出力
      # ========================================
      - name: Show deferred deployment
        if: steps.availability.outputs.available == 'false'
        shell: bash
        run: |
          echo "Deployment has been deferred."
          echo "Commit: $COMMIT_SHA"
          echo "Parameter: $PARAMETER_NAME"
          echo "The EC2 deployment timer will retry."

          {
            echo "## Frontend Deployment Deferred"
            echo ""
            echo "- Commit: $COMMIT_SHA"
            echo "- Status: Pending deployment"
            echo "- Parameter: $PARAMETER_NAME"
          } >> "$GITHUB_STEP_SUMMARY"

name: Frontend CI/CD

# ========================================
# 実行トリガー
# ========================================
on:
  push:
  pull_request:
  workflow_dispatch:

# デフォルトの権限
permissions:
  contents: read

jobs:
  # ========================================
  # CI：品質チェック
  # ========================================
  ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ソースコードの取得
      - name: Checkout source code
        uses: actions/checkout@v5

      # Node.js実行環境の構築
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      # 依存ライブラリのインストール
      - name: Install dependencies
        run: npm ci

      # ESLintによる静的解析
      - name: Run lint
        run: npm run lint

      # TypeScriptの型チェック
      - name: Run type check
        run: npm run typecheck

      # 本番用ビルドチェック
      - name: Run build
        run: npm run build

  # ========================================
  # CD：AWSへの自動デプロイ
  # ========================================
  deploy:
    name: Deploy Frontend to AWS

    # CIが成功した場合のみ実行
    needs: ci

    # mainブランチのPush・手動実行のみ許可
    if: >-
      success() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')

    runs-on: ubuntu-latest
    timeout-minutes: 75

    # AWSへのOIDC認証権限
    permissions:
      contents: read
      id-token: write

    # 同時デプロイの防止
    concurrency:
      group: portfolio-frontend-production
      cancel-in-progress: false

    # ========================================
    # 環境変数
    # ========================================
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      SSM_DOCUMENT_NAME: Portfolio-Deploy-Frontend

      # CIで検証したコミットSHA
      COMMIT_SHA: ${{ github.sha }}

    steps:
      # AWSへのOIDC認証
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 5400

      # AWS認証結果の確認
      - name: Verify AWS identity
        shell: bash
        run: |
          aws sts get-caller-identity

      # ========================================
      # SSM経由でデプロイを実行
      # ========================================
      - name: Execute deployment
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          # デプロイ対象コミットの出力
          echo "Target commit: $COMMIT_SHA"

          # コミットSHAの形式チェック
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid commit SHA."
            exit 1
          fi

          # 検証済みコミットをSSMへ渡す
          COMMAND_ID=$(aws ssm send-command \
            --document-name "$SSM_DOCUMENT_NAME" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --parameters "CommitSha=$COMMIT_SHA" \
            --timeout-seconds 120 \
            --comment "GitHub Actions Frontend Deployment" \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      # ========================================
      # デプロイ処理の完了を待機
      # ========================================
      - name: Wait for deployment
        shell: bash
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          set -euo pipefail

          for i in $(seq 1 400); do

            if ! STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text); then

              sleep 10
              continue
            fi

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment completed."
                exit 0
                ;;

              Pending|InProgress|Delayed|Cancelling)
                sleep 10
                ;;

              *)
                echo "Deployment failed: $STATUS"
                exit 1
                ;;
            esac

          done

          echo "Deployment timed out."
          exit 1

      # ========================================
      # デプロイ結果の出力
      # ========================================
      - name: Show deployment result
        if: always() && steps.deploy.outputs.command_id != ''
        shell: bash
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json
